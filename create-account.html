      <div class="si-form">
        <h1 class="serif" id="si-heading">Create your candidate profile.</h1>
        <p id="si-subtext">Apply once and let our advisors match you to the right mandates.</p>

        <div class="si-toggle">
          <button type="button" data-role="employer">Employer</button>
          <button type="button" class="active" data-role="candidate">Candidate</button>
        </div>

        <form novalidate>
          <div class="si-form-row">
            <div class="si-field">
              <label for="si-first">First name</label>
              <input id="si-first" type="text" placeholder="Elena" pattern="[A-Za-z]+(?:[ '-][A-Za-z]+)*" required>
            </div>
            <div class="si-field">
              <label for="si-last">Last name</label>
              <input id="si-last" type="text" placeholder="Marsh" pattern="[A-Za-z]+(?:[ '-][A-Za-z]+)*" required>
            </div>
          </div>

          <div class="si-field">
            <label for="si-role" id="si-role-label">Current or most recent role</label>
            <input id="si-role" type="text" placeholder="Head of Finance" required>
          </div>

          <div class="si-field">
            <label for="si-location">Location</label>
            <input id="si-location" type="text" placeholder="London, UK" required>
          </div>

          <div class="si-field">
            <label for="si-email" id="si-email-label">Email</label>
            <input id="si-email" type="email" pattern="[^\s@]+@[^\s@]+\.[A-Za-z]{2,}" placeholder="you@email.com" required>
          </div>

          <div class="si-field">
            <label for="si-password">Password</label>
            <div class="si-password-wrapper">
              <input id="si-password" type="password" placeholder="••••••••" minlength="8" required>
              <button type="button" class="si-password-toggle" id="si-password-toggle" aria-label="Show password">
                <svg class="si-eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <div class="si-field-hint">Minimum 8 characters, with a number or symbol.</div>
          </div>

          <div class="si-field">
            <label for="si-password2">Re-enter password</label>
            <div class="si-password-wrapper">
              <input id="si-password2" type="password" placeholder="••••••••" minlength="8" required>
              <button type="button" class="si-password-toggle" id="si-password-toggle2" aria-label="Show password">
                <svg class="si-eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <label class="si-terms">
            <input id="si-terms" type="checkbox" required>
            I agree to the terms of engagement and privacy policy.
          </label>

          <button type="submit" class="si-submit" id="si-submit">Create candidate account</button>
        </form>

        <div class="si-signup">Already with us? <a href="signin.html">Sign in</a></div>
